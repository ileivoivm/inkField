<body>
Loading Landscape 1200×800…
<script>
  // 如果 SW 已註冊，直接 redirect；否則先註冊 SW 再 redirect
  (function(){
    var go = function(){ location.replace('./index.html?_w:1200_h:800_artist:1'); };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(go).catch(go);
    } else { go(); }
  })();
</script>
</body>
