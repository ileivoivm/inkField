<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5f0"/>
      <stop offset="1" stop-color="#ede6d8"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0ece2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="60" text-anchor="middle" font-size="38" font-weight="700" fill="#1a1a1a">How to Submit to inkField</text>
  <text x="450" y="92" text-anchor="middle" font-size="18" fill="#555">5 steps · about 5 minutes · no coding required</text>
  <line x1="120" y1="110" x2="780" y2="110" stroke="#b8a98a" stroke-width="1"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="120" y="140" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="205" r="32" fill="#2c2c2c"/>
  <text x="175" y="216" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">1</text>
  <text x="230" y="185" font-size="22" font-weight="700" fill="#1a1a1a">Paint &amp; click SAVE</text>
  <text x="230" y="215" font-size="16" fill="#444">After finishing your artwork in inkField,</text>
  <text x="230" y="240" font-size="16" fill="#444">click SAVE on the right panel. A .json file downloads.</text>

  <line x1="450" y1="280" x2="450" y2="310" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="120" y="320" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="385" r="32" fill="#2c2c2c"/>
  <text x="175" y="396" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">2</text>
  <text x="230" y="365" font-size="22" font-weight="700" fill="#1a1a1a">Open the submission page</text>
  <text x="230" y="395" font-size="16" fill="#444">ileivoivm.github.io/inkField/gallery/upload.html</text>
  <text x="230" y="420" font-size="16" fill="#444">(just open it in your browser)</text>

  <line x1="450" y1="460" x2="450" y2="490" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="120" y="500" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="565" r="32" fill="#2c2c2c"/>
  <text x="175" y="576" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">3</text>
  <text x="230" y="545" font-size="22" font-weight="700" fill="#1a1a1a">Drag the file onto the page</text>
  <text x="230" y="575" font-size="16" fill="#444">Drop your .json file anywhere on the page to validate it.</text>
  <text x="230" y="600" font-size="16" fill="#2a7a2a">✓ Green check = OK　　✗ Red error = save again</text>

  <line x1="450" y1="640" x2="450" y2="670" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="120" y="680" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="745" r="32" fill="#2c2c2c"/>
  <text x="175" y="756" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">4</text>
  <text x="230" y="725" font-size="22" font-weight="700" fill="#1a1a1a">Fill in the details</text>
  <text x="230" y="755" font-size="16" fill="#444">Title　·　Your name　·　Tags</text>
  <text x="230" y="780" font-size="16" fill="#444">Then click Generate metadata</text>

  <line x1="450" y1="820" x2="450" y2="850" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="120" y="860" width="660" height="160" rx="14" fill="#fff8e8" stroke="#d4a017" stroke-width="2.5"/>
  </g>
  <circle cx="175" cy="940" r="32" fill="#d4a017"/>
  <text x="175" y="951" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">5</text>
  <text x="230" y="895" font-size="22" font-weight="700" fill="#1a1a1a">Submit on GitHub</text>
  <text x="230" y="922" font-size="16" fill="#444">Click Submit via GitHub Issue (sign in if first time)</text>
  <text x="230" y="947" font-size="16" fill="#b8860b" font-weight="600">⚠ Key step: drag the .json file into the comment box again!</text>
  <text x="230" y="972" font-size="16" fill="#444">Finally, click the green Submit new issue button</text>
  <text x="230" y="997" font-size="16" fill="#444">🎉 Done! You'll hear back within a few days</text>

  <!-- Footer -->
  <line x1="120" y1="1060" x2="780" y2="1060" stroke="#b8a98a" stroke-width="1"/>
  <text x="450" y="1095" text-anchor="middle" font-size="15" fill="#666">Free GitHub account needed　·　You keep full copyright　·　Human &amp; AI works welcome</text>
  <text x="450" y="1120" text-anchor="middle" font-size="13" fill="#888">inkField by Aluan Wang</text>
</svg>
