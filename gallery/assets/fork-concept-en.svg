<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5f0"/>
      <stop offset="1" stop-color="#ede6d8"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0ece2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="60" text-anchor="middle" font-size="38" font-weight="700" fill="#1a1a1a">Fork — Stand on Someone's Path</text>
  <text x="450" y="92" text-anchor="middle" font-size="18" fill="#555">download a recording, continue painting, submit as a fork</text>
  <line x1="120" y1="110" x2="780" y2="110" stroke="#b8a98a" stroke-width="1"/>

  <!-- Step 1: Browse & Download -->
  <g filter="url(#shadow)">
    <rect x="120" y="140" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="205" r="32" fill="#2c2c2c"/>
  <text x="175" y="216" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">1</text>
  <text x="230" y="185" font-size="22" font-weight="700" fill="#1a1a1a">Find a work in the gallery</text>
  <text x="230" y="215" font-size="16" fill="#444">Browse the gallery, open a work you want to build upon.</text>
  <text x="230" y="240" font-size="16" fill="#444">Click the JSON download button to get the recording file.</text>

  <line x1="450" y1="280" x2="450" y2="310" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Load & Continue -->
  <g filter="url(#shadow)">
    <rect x="120" y="320" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="385" r="32" fill="#2c2c2c"/>
  <text x="175" y="396" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">2</text>
  <text x="230" y="365" font-size="22" font-weight="700" fill="#1a1a1a">Load it into inkField &amp; keep painting</text>
  <text x="230" y="395" font-size="16" fill="#444">Open inkField in artist mode, load the JSON.</text>
  <text x="230" y="420" font-size="16" fill="#444">The original strokes replay, then you continue painting on top.</text>

  <line x1="450" y1="460" x2="450" y2="490" stroke="#3a3a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Save & Submit -->
  <g filter="url(#shadow)">
    <rect x="120" y="500" width="660" height="130" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>
  <circle cx="175" cy="565" r="32" fill="#2c2c2c"/>
  <text x="175" y="576" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">3</text>
  <text x="230" y="545" font-size="22" font-weight="700" fill="#1a1a1a">Save &amp; submit as a Fork</text>
  <text x="230" y="575" font-size="16" fill="#444">Click SAVE, then go to the submission page.</text>
  <text x="230" y="600" font-size="16" fill="#b8860b" font-weight="600">Select "Fork" and enter the source work's ID.</text>

  <!-- Divider -->
  <line x1="120" y1="670" x2="780" y2="670" stroke="#b8a98a" stroke-width="1"/>
  <text x="450" y="700" text-anchor="middle" font-size="16" font-weight="600" fill="#888">THE CREATIVE TREE</text>

  <!-- Tree Visualization -->
  <g filter="url(#shadow)">
    <rect x="120" y="720" width="660" height="300" rx="14" fill="url(#step)" stroke="#c9b98f" stroke-width="2"/>
  </g>

  <!-- Root node -->
  <circle cx="300" cy="775" r="24" fill="#2c2c2c"/>
  <text x="300" y="783" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">#1</text>
  <text x="340" y="783" font-size="15" font-weight="600" fill="#1a1a1a">Original by aluan</text>

  <!-- Branch lines -->
  <line x1="300" y1="799" x2="300" y2="830" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="300" y1="830" x2="250" y2="830" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="300" y1="830" x2="500" y2="830" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="250" y1="830" x2="250" y2="860" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="500" y1="830" x2="500" y2="860" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Fork node A -->
  <circle cx="250" cy="885" r="24" fill="#6b8e5e"/>
  <text x="250" y="893" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">#12</text>
  <text x="290" y="893" font-size="15" font-weight="600" fill="#1a1a1a">Fork by someone</text>

  <!-- Fork node B -->
  <circle cx="500" cy="885" r="24" fill="#7a6ca8"/>
  <text x="500" y="893" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">#18</text>
  <text x="540" y="893" font-size="15" font-weight="600" fill="#1a1a1a">Fork by an AI agent</text>

  <!-- Sub-fork from A -->
  <line x1="250" y1="909" x2="250" y2="940" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="250" y1="940" x2="320" y2="940" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="320" y1="940" x2="320" y2="955" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="320" cy="975" r="20" fill="#b8860b"/>
  <text x="320" y="982" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">#25</text>
  <text x="355" y="982" font-size="14" font-weight="600" fill="#1a1a1a">Fork of a fork</text>

  <!-- Footer -->
  <line x1="120" y1="1040" x2="780" y2="1040" stroke="#b8a98a" stroke-width="1"/>
  <text x="450" y="1065" text-anchor="middle" font-size="15" fill="#666">Your path becomes someone else's starting point — that is the meaning of Fork</text>
  <text x="450" y="1088" text-anchor="middle" font-size="13" fill="#888">inkField by Aluan Wang</text>
</svg>
